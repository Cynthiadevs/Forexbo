services:
  # 1. Main Forex AI Intelligence API & Telegram Live Engine (All-In-One Web Service)
  - type: web
    name: forex-ai-engine
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: MARKET_DATA_PROVIDER
        value: DEMO
      - key: TELEGRAM_BOT_TOKEN
        sync: false # Set your token from @BotFather in Render Dashboard
      - key: TELEGRAM_DEFAULT_CHANNEL_ID
        value: "@AlphaQuantFX"
      - key: OPENAI_API_KEY
        sync: false # Optional: Set your OpenAI API key in Render Dashboard
      - key: OPENAI_MODEL
        value: "gpt-4o-mini"
      - key: OPENAI_MAX_DAILY_BUDGET_USD
        value: "5.00"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: BRAND_NAME
        value: "ALPHA QUANT FX"
      - key: BRAND_WEBSITE
        value: "https://alphaquantfx.io"
      - key: BRAND_TELEGRAM
        value: "@AlphaQuantFX"
